name: BRTibia - Android

# Compila o APK Android do codigo do branch brtibia quando ele e enviado para o branch
# "brtibia-android" (git push origin brtibia:brtibia-android).
# O APK sai sem Tibia.spr/Tibia.dat (nao ficam no repositorio); eles sao colocados na remontagem.
on:
  push:
    branches:
      - brtibia-android
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: brtibia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build - Android
    uses: ./.github/workflows/reusable-build-android-apk.yml
    secrets: inherit
